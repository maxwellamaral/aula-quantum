[project]
name = "aula-quantum"
version = "0.1.0"
description = "Curso de extensão — Fundamentos de Computação Quântica para Engenharia de Software"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jupyter>=1.1.1",
    "qiskit>=2.2.3",
    "qiskit-aer>=0.17.2",
    "numpy>=2.0",
    "sympy>=1.14",
    "matplotlib>=3.10",
    "plotly>=6.5",
    "pylatexenc>=2.10",
    "ipywidgets>=8.1",
    "seaborn>=0.13.2",
    "kaleido>=1.3.0",
    "scikit-learn>=1.7.2",
    "qiskit-algorithms>=0.4.0",
    "qiskit-machine-learning>=0.9.1",
    "jupyter-cache>=1.0.1",
]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
