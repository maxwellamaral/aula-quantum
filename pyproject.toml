[project]
name = "aula-quantum"
version = "0.1.0"
description = "Curso de extensão — Fundamentos de Computação Quântica para Engenharia de Software"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyter>=1.1.1",
    "cirq-core>=1.6.1",
    "cirq>=1.6.1",
    "numpy>=1.26",
    "sympy>=1.13",
    "matplotlib>=3.8",
    "plotly>=6.0",
    "pylatexenc>=2.10",
    "ipywidgets>=8.1",
    "seaborn>=0.13.2",
    "kaleido>=1.0.0",
    "scikit-learn>=1.4.0",
    "jupyter-cache>=1.0.1",
]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
